name: Apply crossing popup fixes

on:
  push:
    branches:
      - fix/crossing-popup-and-run-panel

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/crossing-popup-and-run-panel
          fetch-depth: 0

      - name: Apply requested fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index_path = Path("docs/index.html")
          html = index_path.read_text(encoding="utf-8")

          css_anchor = "    .error-box{position:absolute;top:64px;left:50%;transform:translateX(-50%);z-index:1001;background:#fee2e2;color:#7f1d1d;border:1px solid #fecaca;border-radius:12px;padding:12px 14px;box-shadow:var(--shadow);max-width:720px;font-weight:700}\n"
          css_insert = """    .run-panel{position:absolute;top:60px;left:60px;z-index:1001;background:white;color:#0f172a;border-radius:14px;padding:12px;box-shadow:var(--shadow);border:1px solid #cbd5e1;width:min(430px,calc(100vw - 46px));font-size:13px}\n    .run-panel.collapsed{width:auto;min-width:250px}\n    .run-panel-header{display:flex;align-items:center;justify-content:space-between;gap:12px}\n    .run-panel-title{font-weight:850;font-size:15px}\n    .run-panel-toggle{border:1px solid #cbd5e1;border-radius:8px;background:#f8fafc;color:#0f172a;font:inherit;font-weight:750;padding:5px 8px;cursor:pointer}\n    .run-panel-toggle:hover{background:#e2e8f0}\n    .run-panel-body{margin-top:8px}\n    .run-panel.collapsed .run-panel-body{display:none}\n    .run-key-label-line{display:flex;align-items:baseline;gap:5px;flex-wrap:wrap}\n    .run-key-repo{color:#64748b;font-size:12px;font-weight:650}\n"""
          if css_insert not in html:
              assert css_anchor in html, "Could not find CSS insertion point"
              html = html.replace(css_anchor, css_insert + css_anchor, 1)

          panel_start = html.index('  <div id="runPanel"')
          panel_end = html.index('<script>\n(function(){', panel_start)
          new_panel = """  <div id="runPanel" class="run-panel">
    <div class="run-panel-header">
      <div class="run-panel-title">Parish/County line crossings</div>
      <button id="runPanelToggle" class="run-panel-toggle" type="button" aria-expanded="true" aria-controls="runPanelBody">Collapse</button>
    </div>

    <div id="runPanelBody" class="run-panel-body">
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
        <label style="display:flex;flex-direction:column;gap:4px;font-weight:750">
          Start date
          <input id="startDate" type="date" style="font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:7px 8px">
        </label>

        <label style="display:flex;flex-direction:column;gap:4px;font-weight:750">
          End date
          <input id="endDate" type="date" style="font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:7px 8px">
        </label>

        <input id="bbox" type="hidden" value="-91.8,28.5,-87.8,31.5">

        <label style="grid-column:1/-1;display:flex;flex-direction:column;gap:4px;font-weight:750">
          <span class="run-key-label-line"><span>Run key</span><span class="run-key-repo">(tornado-path-calculator)</span></span>
          <input id="runKey" type="password" autocomplete="off" placeholder="Paste Password" style="font:inherit;border:1px solid #cbd5e1;border-radius:9px;padding:7px 8px">
        </label>
      </div>

      <div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">
        <button id="runBtn" style="border:0;border-radius:10px;background:#0f172a;color:white;font-weight:850;padding:8px 11px;cursor:pointer">Start workflow</button>
        <span id="runStatus" style="font-size:12px;color:#334155;line-height:1.35">Ready.</span>
      </div>

      <div style="margin-top:7px;color:#64748b;font-size:12px;line-height:1.3">
        The map will auto-refresh after about 1 minute once you click START WORKFLOW.
      </div>
    </div>
  </div>

"""
          html = html[:panel_start] + new_panel + html[panel_end:]

          storage_anchor = 'const RUN_FORM_STORAGE_KEY = "tornadoPathWorkflowRunForm";\n'
          storage_insert = 'const RUN_PANEL_COLLAPSED_STORAGE_KEY = "tornadoPathWorkflowRunPanelCollapsed";\n'
          if storage_insert not in html:
              assert storage_anchor in html, "Could not find storage key insertion point"
              html = html.replace(storage_anchor, storage_anchor + storage_insert, 1)

          collapse_anchor = "function buildWorkflowTriggerUrl(runKey, startDate, endDate, bbox) {\n"
          collapse_functions = """function setRunPanelCollapsed(collapsed) {
  const panel = document.getElementById("runPanel");
  const toggle = document.getElementById("runPanelToggle");

  panel.classList.toggle("collapsed", collapsed);
  toggle.textContent = collapsed ? "Expand" : "Collapse";
  toggle.setAttribute("aria-expanded", String(!collapsed));

  try {
    localStorage.setItem(RUN_PANEL_COLLAPSED_STORAGE_KEY, collapsed ? "1" : "0");
  } catch (e) {
    console.warn("Could not save workflow panel state", e);
  }

  setTimeout(() => map.invalidateSize(true), 0);
}

function initRunPanel() {
  let collapsed = false;

  try {
    collapsed = localStorage.getItem(RUN_PANEL_COLLAPSED_STORAGE_KEY) === "1";
  } catch (e) {
    console.warn("Could not load workflow panel state", e);
  }

  setRunPanelCollapsed(collapsed);
  document.getElementById("runPanelToggle").addEventListener("click", () => {
    setRunPanelCollapsed(!document.getElementById("runPanel").classList.contains("collapsed"));
  });
}

"""
          if collapse_functions not in html:
              assert collapse_anchor in html, "Could not find collapse function insertion point"
              html = html.replace(collapse_anchor, collapse_functions + collapse_anchor, 1)

          group_start = html.index("function groupCrossings(rows) {")
          group_end = html.index("function formatDateTime(v) {", group_start)
          new_group = """function normalizeEventId(value) {
  const text = value === null || value === undefined ? "" : String(value).trim();
  if (!text) return "";
  return /^-?\\d+\\.0+$/.test(text) ? text.replace(/\\.0+$/, "") : text;
}

function featureEventId(feature) {
  const p = feature.properties || {};
  return normalizeEventId(p.event_id) ||
         normalizeEventId(p.objectid) ||
         normalizeEventId(p.OBJECTID) ||
         normalizeEventId(feature.id);
}

function timeMatchKey(value) {
  const formatted = formatDateTime(value);
  return formatted === "—" ? "" : formatted.toLowerCase();
}

function trackTimeKey(feature) {
  const p = feature.properties || {};
  const start = timeMatchKey(p.starttime);
  const end = timeMatchKey(p.endtime);
  return start && end ? `${start}|${end}` : "";
}

function groupCrossings(rows, tracks) {
  const g = new Map();
  const tracksByTime = new Map();
  const features = tracks && Array.isArray(tracks.features) ? tracks.features : [];

  features.forEach(feature => {
    const id = featureEventId(feature);
    const timeKey = trackTimeKey(feature);
    if (!id || !timeKey) return;
    if (!tracksByTime.has(timeKey)) tracksByTime.set(timeKey, []);
    tracksByTime.get(timeKey).push(id);
  });

  rows.forEach(r => {
    let id = normalizeEventId(r.event_id);

    if (!id) {
      const rowTimeKey = `${timeMatchKey(r.start_time)}|${timeMatchKey(r.end_time)}`;
      const candidates = tracksByTime.get(rowTimeKey) || [];
      if (candidates.length === 1) id = candidates[0];
    }

    if (!id) id = "UNKNOWN";
    r._resolved_event_id = id;

    if (!g.has(id)) g.set(id, []);
    g.get(id).push(r);
  });

  g.forEach(a => {
    a.sort((x, y) => parseFloat(x.crossing_distance_miles || 0) - parseFloat(y.crossing_distance_miles || 0));
  });

  return g;
}

"""
          html = html[:group_start] + new_group + html[group_end:]

          coord_anchor = "function durationMinutes(s, e) {\n"
          coord_functions = """function formatLatLon(lat, lon) {
  const latNum = Number(lat);
  const lonNum = Number(lon);
  if (!Number.isFinite(latNum) || !Number.isFinite(lonNum)) return "—";
  return `${latNum.toFixed(6)} / ${lonNum.toFixed(6)}`;
}

function trackEndpointLatLon(feature, endpoint) {
  const geometry = feature.geometry || {};
  let lines = [];

  if (geometry.type === "LineString" && Array.isArray(geometry.coordinates)) {
    lines = [geometry.coordinates];
  } else if (geometry.type === "MultiLineString" && Array.isArray(geometry.coordinates)) {
    lines = geometry.coordinates.filter(line => Array.isArray(line) && line.length);
  }

  if (!lines.length) return "—";
  const line = endpoint === "end" ? lines[lines.length - 1] : lines[0];
  const coord = endpoint === "end" ? line[line.length - 1] : line[0];
  if (!Array.isArray(coord) || coord.length < 2) return "—";

  return formatLatLon(coord[1], coord[0]);
}

"""
          if coord_functions not in html:
              assert coord_anchor in html, "Could not find coordinate function insertion point"
              html = html.replace(coord_anchor, coord_functions + coord_anchor, 1)

          old_id = '  const id = clean(p.event_id || p.objectid || f.id);\n'
          new_id = '  const id = featureEventId(f) || "UNKNOWN";\n'
          assert old_id in html, "Could not find popup event ID line"
          html = html.replace(old_id, new_id, 1)

          old_time_rows = '  h += detailRow("Start time:", formatDateTime(firstNonBlank(first.start_time, p.starttime)));\n  h += detailRow("End time:", formatDateTime(firstNonBlank(first.end_time, p.endtime)));\n'
          new_time_rows = '  h += detailRow("Start time:", formatDateTime(firstNonBlank(first.start_time, p.starttime)));\n  h += detailRow("Start Lat/Lon:", trackEndpointLatLon(f, "start"));\n  h += detailRow("End time:", formatDateTime(firstNonBlank(first.end_time, p.endtime)));\n  h += detailRow("End Lat/Lon:", trackEndpointLatLon(f, "end"));\n'
          assert old_time_rows in html, "Could not find popup time rows"
          html = html.replace(old_time_rows, new_time_rows, 1)

          init_anchor = '    setDefaultDatesForRunForm();\n'
          init_replacement = '    initRunPanel();\n    setDefaultDatesForRunForm();\n'
          assert init_anchor in html, "Could not find init insertion point"
          html = html.replace(init_anchor, init_replacement, 1)

          old_group_call = '    crossingsByEvent = groupCrossings(allCrossings);\n'
          new_group_call = '    crossingsByEvent = groupCrossings(allCrossings, tracks);\n'
          assert old_group_call in html, "Could not find groupCrossings call"
          html = html.replace(old_group_call, new_group_call, 1)

          required_index_strings = [
              '(tornado-path-calculator)',
              'Start Lat/Lon:',
              'End Lat/Lon:',
              'groupCrossings(allCrossings, tracks)',
              'runPanelToggle',
          ]
          for value in required_index_strings:
              assert value in html, f"Missing expected index content: {value}"

          index_path.write_text(html, encoding="utf-8")

          fetch_path = Path("scripts/fetch_dat_tracks.py")
          fetch_text = fetch_path.read_text(encoding="utf-8")

          helper_anchor = "def fetch_dat_lines(start_date, end_date, bbox, output):\n"
          helper = """def normalize_event_ids(data):
    \"\"\"Fill blank DAT event IDs from the stable ArcGIS object ID.\"\"\"
    normalized = 0

    for feature in data.get("features", []):
        properties = feature.setdefault("properties", {})
        current = properties.get("event_id")
        if current is not None and str(current).strip():
            continue

        fallback = properties.get("objectid", properties.get("OBJECTID"))
        if fallback is None or not str(fallback).strip():
            continue

        if isinstance(fallback, float) and fallback.is_integer():
            fallback = int(fallback)

        properties["event_id"] = str(fallback).strip()
        normalized += 1

    return normalized


"""
          if helper not in fetch_text:
              assert helper_anchor in fetch_text, "Could not find fetch helper insertion point"
              fetch_text = fetch_text.replace(helper_anchor, helper + helper_anchor, 1)

          json_anchor = "    data = r.json()\n\n"
          json_replacement = "    data = r.json()\n    normalized_event_ids = normalize_event_ids(data)\n\n"
          assert json_anchor in fetch_text, "Could not find DAT JSON load"
          fetch_text = fetch_text.replace(json_anchor, json_replacement, 1)

          count_anchor = '    print(f"Wrote {feature_count} DAT line features to {output}")\n\n'
          count_replacement = '    print(f"Wrote {feature_count} DAT line features to {output}")\n    if normalized_event_ids:\n        print(f"Filled {normalized_event_ids} blank event_id value(s) from objectid.")\n\n'
          assert count_anchor in fetch_text, "Could not find feature count print"
          fetch_text = fetch_text.replace(count_anchor, count_replacement, 1)

          fetch_path.write_text(fetch_text, encoding="utf-8")

          for csv_name in [
              "output/tornado_crossing_times.csv",
              "docs/data/tornado_crossing_times.csv",
          ]:
              csv_path = Path(csv_name)
              csv_text = csv_path.read_text(encoding="utf-8")
              old = "\n,1781779440000,LIX,EF1,"
              new = "\n2737583,1781779440000,LIX,EF1,"
              assert old in csv_text, f"Could not find blank event ID row in {csv_name}"
              csv_path.write_text(csv_text.replace(old, new, 1), encoding="utf-8")

          workflow_path = Path(".github/workflows/apply-crossing-popup-fixes.yml")
          workflow_path.unlink()
          PY

      - name: Validate Python and JavaScript syntax
        run: |
          python -m py_compile scripts/fetch_dat_tracks.py scripts/calculate_crossing_times.py
          python - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          import tempfile

          html = Path("docs/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S)
          inline_scripts = [script for script in scripts if script.strip()]
          if not inline_scripts:
              raise SystemExit("No inline JavaScript found")

          for index, script in enumerate(inline_scripts, 1):
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as handle:
                  handle.write(script)
                  filename = handle.name
              subprocess.run(["node", "--check", filename], check=True)
          PY

      - name: Commit patched files and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix crossing association and improve map popups"
          git push origin HEAD:fix/crossing-popup-and-run-panel
