name: Refresh Tornado Crossing Archive

on:
  workflow_dispatch:
  schedule:
    - cron: "17 11 * * *"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/run-crossings.yml"
      - "scripts/**"
      - "config.json"
      - "docs/index.html"

permissions:
  contents: write

concurrency:
  group: tornado-crossing-archive
  cancel-in-progress: true

jobs:
  calculate:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Set archive date range
        id: archive_dates
        shell: bash
        run: |
          echo "start=2015-01-01" >> "$GITHUB_OUTPUT"
          echo "end=$(date -u +%F)" >> "$GITHUB_OUTPUT"

      - name: Fetch parish/county boundaries
        run: python scripts/fetch_boundaries.py

      - name: Fetch DAT tornado archive
        run: |
          python scripts/fetch_dat_tracks.py \
            --start "${{ steps.archive_dates.outputs.start }}" \
            --end "${{ steps.archive_dates.outputs.end }}" \
            --bbox="-91.8,28.5,-87.8,31.5" \
            --output "data/dat_damage_lines.geojson"

      - name: Calculate crossing times
        run: python scripts/calculate_crossing_times.py --config config.json

      - name: Build GitHub Pages data
        run: python scripts/build_map.py

      - name: Upload output CSV
        uses: actions/upload-artifact@v4
        with:
          name: tornado-crossing-times
          path: output/tornado_crossing_times.csv

      - name: Upload interactive map files
        uses: actions/upload-artifact@v4
        with:
          name: tornado-crossing-map
          path: docs/

      - name: Commit refreshed archive
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data/*.geojson output/*.csv docs/data/
          git commit -m "Refresh 2015-present tornado crossing archive" || echo "No changes to commit"
          git push
