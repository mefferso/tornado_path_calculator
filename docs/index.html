<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tornado Path Crossing Calculator</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      --bg: #0f172a;
      --panel: rgba(255, 255, 255, .96);
      --text: #e5e7eb;
      --muted: #94a3b8;
      --shadow: 0 18px 50px rgba(0, 0, 0, .35);
    }

    * { box-sizing: border-box; }

    html, body {
      height: 100%;
      width: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: var(--bg);
    }

    #app {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    header {
      flex: 0 0 auto;
      color: var(--text);
      background: linear-gradient(135deg, #111827, #0f172a 65%, #082f49);
      padding: 10px 14px;
      box-shadow: var(--shadow);
      z-index: 1000;
    }

    .topline {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      letter-spacing: .2px;
    }

    #summary {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #map {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      background: #dbeafe;
    }

    .filter-panel {
      position: absolute;
      top: 60px;
      left: 60px;
      z-index: 1001;
      width: min(430px, calc(100vw - 46px));
      padding: 12px;
      color: #0f172a;
      background: white;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      box-shadow: var(--shadow);
      font-size: 13px;
    }

    .filter-panel.collapsed {
      width: auto;
      min-width: 250px;
    }

    .filter-panel-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .filter-panel-title {
      font-size: 15px;
      font-weight: 850;
    }

    .filter-panel-toggle {
      padding: 5px 8px;
      color: #0f172a;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
      font-weight: 750;
      cursor: pointer;
    }

    .filter-panel-toggle:hover { background: #e2e8f0; }
    .filter-panel-body { margin-top: 8px; }
    .filter-panel.collapsed .filter-panel-body { display: none; }

    .filter-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .filter-label {
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-weight: 750;
    }

    .filter-input {
      width: 100%;
      padding: 7px 8px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      font: inherit;
    }

    .filter-actions {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }

    #filterBtn,
    #allBtn {
      padding: 8px 11px;
      border: 0;
      border-radius: 10px;
      font-weight: 850;
      cursor: pointer;
    }

    #filterBtn {
      color: white;
      background: #0f172a;
    }

    #allBtn {
      color: #0f172a;
      background: #e2e8f0;
    }

    #filterStatus {
      color: #334155;
      font-size: 12px;
      line-height: 1.35;
    }

    .filter-note {
      margin-top: 7px;
      color: #64748b;
      font-size: 12px;
      line-height: 1.35;
    }

    .legend {
      padding: 10px 12px;
      color: #0f172a;
      background: var(--panel);
      border: 1px solid rgba(15, 23, 42, .16);
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-size: 14px;
      line-height: 1.35;
    }

    .legend-title {
      margin-bottom: 6px;
      font-weight: 800;
    }

    .legend-row {
      display: flex;
      align-items: center;
      gap: 7px;
      margin: 4px 0;
    }

    .swatch {
      display: inline-block;
      width: 22px;
      height: 4px;
      border-radius: 999px;
    }

    .leaflet-popup-content-wrapper { border-radius: 14px; }

    .leaflet-popup-content {
      min-width: 370px;
      max-width: 560px;
      margin: 14px 16px;
    }

    .popup-title {
      margin-bottom: 9px;
      color: #0f172a;
      font-size: 19px;
      font-weight: 850;
    }

    .detail-grid {
      display: grid;
      grid-template-columns: 165px 1fr;
      gap: 7px 13px;
      margin-bottom: 10px;
      font-size: 15px;
      line-height: 1.35;
    }

    .detail-key {
      color: #475569;
      font-weight: 750;
    }

    .detail-val {
      color: #111827;
      overflow-wrap: anywhere;
    }

    .detail-val.strong { font-weight: 750; }

    .crossing-block {
      margin: 10px 0;
      padding: 10px 11px;
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
    }

    .crossing-title {
      margin-bottom: 8px;
      color: #0f172a;
      font-size: 16px;
      font-weight: 850;
    }

    .empty-note {
      padding-top: 8px;
      color: #64748b;
      border-top: 1px solid #e2e8f0;
      font-size: 14px;
      font-style: italic;
    }

    .crossing-marker {
      width: 12px;
      height: 12px;
      background: #111827;
      border: 2px solid white;
      border-radius: 50%;
      box-shadow: 0 0 0 2px rgba(15, 23, 42, .35);
    }

    .error-box {
      position: absolute;
      top: 64px;
      left: 50%;
      z-index: 1002;
      max-width: 720px;
      padding: 12px 14px;
      color: #7f1d1d;
      background: #fee2e2;
      border: 1px solid #fecaca;
      border-radius: 12px;
      box-shadow: var(--shadow);
      font-weight: 700;
      transform: translateX(-50%);
    }

    @media (max-width: 640px) {
      .filter-panel {
        top: 58px;
        left: 10px;
        width: calc(100vw - 20px);
      }

      .filter-panel.collapsed {
        width: auto;
        min-width: 0;
      }

      .leaflet-popup-content { min-width: 260px; }
      .detail-grid { grid-template-columns: 132px 1fr; }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <div class="topline">
        <h1>Tornado Path Crossing Calculator</h1>
        <div id="summary">Loading tornado archive…</div>
      </div>
    </header>
    <div id="map"></div>
  </div>

  <div id="filterPanel" class="filter-panel">
    <div class="filter-panel-header">
      <div class="filter-panel-title">Parish/County line crossings</div>
      <button
        id="filterPanelToggle"
        class="filter-panel-toggle"
        type="button"
        aria-expanded="true"
        aria-controls="filterPanelBody"
      >Collapse</button>
    </div>

    <div id="filterPanelBody" class="filter-panel-body">
      <div class="filter-grid">
        <label class="filter-label">
          Start date
          <input id="startDate" class="filter-input" type="date" min="2015-01-01">
        </label>

        <label class="filter-label">
          End date
          <input id="endDate" class="filter-input" type="date" min="2015-01-01">
        </label>
      </div>

      <div class="filter-actions">
        <button id="filterBtn" type="button">Show dates</button>
        <button id="allBtn" type="button">Show all</button>
        <span id="filterStatus">Loading archive…</span>
      </div>

      <div class="filter-note">
        Tracks and crossings are precomputed from 2015-present and refreshed automatically each day.
        Changing dates only filters the archive in your browser; it does not run a workflow.
      </div>
    </div>
  </div>

<script>
(function(){
  const s = document.createElement("style");
  s.textContent = ".leaflet-container{overflow:hidden;position:relative}.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-layer,.leaflet-pane>svg,.leaflet-pane>canvas{position:absolute;left:0;top:0}.leaflet-tile{width:256px;height:256px;border:0;max-width:none!important;max-height:none!important}.leaflet-tile-container img{display:block}.leaflet-map-pane{z-index:400}.leaflet-tile-pane{z-index:200}.leaflet-overlay-pane{z-index:400}.leaflet-shadow-pane{z-index:500}.leaflet-marker-pane{z-index:600}.leaflet-popup-pane{z-index:700}.leaflet-control-container .leaflet-top,.leaflet-control-container .leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}.leaflet-top{top:0}.leaflet-right{right:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-control{position:relative;z-index:800;pointer-events:auto;float:left;clear:both}.leaflet-right .leaflet-control{float:right}.leaflet-top .leaflet-control{margin-top:10px}.leaflet-bottom .leaflet-control{margin-bottom:10px}.leaflet-left .leaflet-control{margin-left:10px}.leaflet-right .leaflet-control{margin-right:10px}.leaflet-control-zoom a{display:block;width:26px;height:26px;line-height:26px;text-align:center;background:#fff;text-decoration:none;color:#111827}.leaflet-control-layers{background:#fff;padding:8px 10px;border-radius:6px;box-shadow:0 1px 5px #0006}.leaflet-popup{position:absolute}.leaflet-popup-content-wrapper{background:#fff}.leaflet-popup-close-button{position:absolute;right:0;top:0;text-decoration:none;color:#555}.leaflet-interactive{cursor:pointer}";
  document.head.appendChild(s);
})();

const TRACKS_URL = "data/dat_damage_lines.geojson";
const CROSSINGS_URL = "data/tornado_crossing_times.csv";
const ARCHIVE_START = "2015-01-01";
const TZ = "America/Chicago";
const FILTER_STORAGE_KEY = "tornadoPathArchiveFilter";
const FILTER_PANEL_COLLAPSED_STORAGE_KEY = "tornadoPathFilterPanelCollapsed";

const map = L.map("map", {
  preferCanvas: true,
  zoomControl: true
}).setView([30.7, -90.0], 7);

const osm = L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
  maxZoom: 19,
  attribution: "&copy; OpenStreetMap contributors"
}).addTo(map);

const topo = L.tileLayer("https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png", {
  maxZoom: 17,
  attribution: "&copy; OpenTopoMap contributors"
});

const crossingsLayer = L.layerGroup().addTo(map);

const pathLayer = L.geoJSON(null, {
  style: feature => trackStyle(feature),
  onEachFeature: (feature, layer) => {
    layer.on({
      mouseover: event => event.target.setStyle({ weight: 7, opacity: 1 }),
      mouseout: event => pathLayer.resetStyle(event.target),
      click: event => {
        layer.bindPopup(buildTrackPopup(feature), { maxWidth: 600 }).openPopup(event.latlng);
      }
    });
  }
}).addTo(map);

L.control.layers(
  { "OpenStreetMap": osm, "Topo": topo },
  { "Tornado paths": pathLayer, "Boundary crossings": crossingsLayer },
  { collapsed: false }
).addTo(map);

const crossingIcon = L.divIcon({
  className: "",
  html: "<div class='crossing-marker'></div>",
  iconSize: [16, 16],
  iconAnchor: [8, 8]
});

let allTracks = { type: "FeatureCollection", features: [] };
let allCrossings = [];
let crossingsByEvent = new Map();
let archiveEnd = todayDateKey();

function efColor(value) {
  const normalized = String(value || "").toUpperCase().trim();

  return {
    EF0: "#22c55e",
    EF1: "#eab308",
    EF2: "#f97316",
    EF3: "#ef4444",
    EF4: "#a855f7",
    EF5: "#111827"
  }[normalized] || "#2563eb";
}

function trackStyle(feature) {
  const properties = feature.properties || {};

  return {
    color: efColor(properties.efscale),
    weight: 5,
    opacity: .88,
    lineCap: "round",
    lineJoin: "round"
  };
}

function todayDateKey() {
  const now = new Date();
  const year = now.getFullYear();
  const month = String(now.getMonth() + 1).padStart(2, "0");
  const day = String(now.getDate()).padStart(2, "0");
  return `${year}-${month}-${day}`;
}

function dateKeyFromDate(date) {
  if (!(date instanceof Date) || Number.isNaN(date.getTime())) {
    return "";
  }

  const parts = new Intl.DateTimeFormat("en-US", {
    timeZone: TZ,
    year: "numeric",
    month: "2-digit",
    day: "2-digit"
  }).formatToParts(date);

  const values = Object.fromEntries(parts.map(part => [part.type, part.value]));
  return `${values.year}-${values.month}-${values.day}`;
}

function dateKeyFromValue(value) {
  if (value === null || value === undefined || String(value).trim() === "") {
    return "";
  }

  const text = String(value).trim();
  const numeric = Number(text);

  if (Number.isFinite(numeric)) {
    const milliseconds = numeric > 10_000_000_000 ? numeric : numeric * 1000;
    return dateKeyFromDate(new Date(milliseconds));
  }

  const isoMatch = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (isoMatch) {
    return `${isoMatch[1]}-${isoMatch[2]}-${isoMatch[3]}`;
  }

  const parsed = new Date(text);
  return dateKeyFromDate(parsed);
}

function featureDateRange(feature) {
  const properties = feature.properties || {};
  const fallback = dateKeyFromValue(properties.stormdate);
  const start = dateKeyFromValue(properties.starttime) || fallback;
  const end = dateKeyFromValue(properties.endtime) || start || fallback;
  return { start, end };
}

function featureOverlapsRange(feature, startDate, endDate) {
  const range = featureDateRange(feature);
  if (!range.start || !range.end) {
    return false;
  }
  return range.end >= startDate && range.start <= endDate;
}

function parseCsv(text) {
  const rows = [];
  let row = [];
  let value = "";
  let quoted = false;

  for (let index = 0; index < text.length; index += 1) {
    const character = text[index];
    const next = text[index + 1];

    if (character === '"') {
      if (quoted && next === '"') {
        value += '"';
        index += 1;
      } else {
        quoted = !quoted;
      }
    } else if (character === "," && !quoted) {
      row.push(value);
      value = "";
    } else if ((character === "\n" || character === "\r") && !quoted) {
      if (character === "\r" && next === "\n") {
        index += 1;
      }
      row.push(value);
      if (row.some(item => item.trim() !== "")) {
        rows.push(row);
      }
      row = [];
      value = "";
    } else {
      value += character;
    }
  }

  row.push(value);
  if (row.some(item => item.trim() !== "")) {
    rows.push(row);
  }

  if (!rows.length) {
    return [];
  }

  const headers = rows[0].map(item => item.trim());

  return rows.slice(1).map(values => {
    const output = {};
    headers.forEach((header, index) => {
      output[header] = (values[index] ?? "").trim();
    });
    return output;
  });
}

function normalizeEventId(value) {
  const text = value === null || value === undefined ? "" : String(value).trim();
  if (!text) return "";
  return /^-?\d+\.0+$/.test(text) ? text.replace(/\.0+$/, "") : text;
}

function featureEventId(feature) {
  const properties = feature.properties || {};
  return normalizeEventId(properties.event_id) ||
    normalizeEventId(properties.objectid) ||
    normalizeEventId(properties.OBJECTID) ||
    normalizeEventId(feature.id);
}

function formatDateTime(value) {
  if (value === null || value === undefined || String(value).trim() === "") {
    return "—";
  }

  const text = String(value).trim();
  const epoch = Number(text);

  if (Number.isFinite(epoch)) {
    const milliseconds = epoch > 10_000_000_000 ? epoch : epoch * 1000;
    return new Intl.DateTimeFormat("en-US", {
      timeZone: TZ,
      year: "numeric",
      month: "2-digit",
      day: "2-digit",
      hour: "numeric",
      minute: "2-digit",
      hour12: true,
      timeZoneName: "short"
    })
      .format(new Date(milliseconds))
      .replace(/\//g, "-")
      .replace(/\bAM\b/g, "am")
      .replace(/\bPM\b/g, "pm");
  }

  const match = text.match(
    /^(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})(?::\d{2})?\s*(AM|PM|am|pm)?\s*([A-Z]{2,4})?$/
  );

  if (match) {
    let hour = Number(match[4]);
    const minute = match[5];
    let suffix = match[6] ? match[6].toLowerCase() : "";
    const zone = match[7] || "CDT";

    if (!suffix) {
      suffix = hour >= 12 ? "pm" : "am";
      hour = hour % 12 || 12;
    }

    return `${match[2]}-${match[3]}-${match[1]}, ${hour}:${minute} ${suffix} ${zone}`;
  }

  return text;
}

function timeMatchKey(value) {
  const formatted = formatDateTime(value);
  return formatted === "—" ? "" : formatted.toLowerCase();
}

function trackTimeKey(feature) {
  const properties = feature.properties || {};
  const start = timeMatchKey(properties.starttime);
  const end = timeMatchKey(properties.endtime);
  return start && end ? `${start}|${end}` : "";
}

function groupCrossings(rows, tracks) {
  const grouped = new Map();
  const tracksByTime = new Map();
  const features = tracks && Array.isArray(tracks.features) ? tracks.features : [];

  features.forEach(feature => {
    const id = featureEventId(feature);
    const timeKey = trackTimeKey(feature);
    if (!id || !timeKey) return;
    if (!tracksByTime.has(timeKey)) tracksByTime.set(timeKey, []);
    tracksByTime.get(timeKey).push(id);
  });

  rows.forEach(row => {
    let id = normalizeEventId(row.event_id);

    if (!id) {
      const rowTimeKey = `${timeMatchKey(row.start_time)}|${timeMatchKey(row.end_time)}`;
      const candidates = tracksByTime.get(rowTimeKey) || [];
      if (candidates.length === 1) id = candidates[0];
    }

    if (!id) id = "UNKNOWN";
    row._resolved_event_id = id;

    if (!grouped.has(id)) grouped.set(id, []);
    grouped.get(id).push(row);
  });

  grouped.forEach(group => {
    group.sort((left, right) =>
      parseFloat(left.crossing_distance_miles || 0) -
      parseFloat(right.crossing_distance_miles || 0)
    );
  });

  return grouped;
}

function clean(value) {
  return value === null || value === undefined || value === "" ? "—" : String(value);
}

function firstNonBlank(...values) {
  for (const value of values) {
    if (value !== null && value !== undefined && String(value).trim() !== "") {
      return value;
    }
  }
  return "";
}

function formatWithUnit(value, unit) {
  const cleaned = clean(value);
  if (cleaned === "—") return cleaned;
  return String(cleaned).match(new RegExp(`\\b${unit}\\b`, "i"))
    ? cleaned
    : `${cleaned} ${unit}`;
}

function formatLatLon(lat, lon) {
  const latNumber = Number(lat);
  const lonNumber = Number(lon);
  if (!Number.isFinite(latNumber) || !Number.isFinite(lonNumber)) return "—";
  return `${latNumber.toFixed(6)} / ${lonNumber.toFixed(6)}`;
}

function trackEndpointLatLon(feature, endpoint) {
  const geometry = feature.geometry || {};
  let lines = [];

  if (geometry.type === "LineString" && Array.isArray(geometry.coordinates)) {
    lines = [geometry.coordinates];
  } else if (
    geometry.type === "MultiLineString" &&
    Array.isArray(geometry.coordinates)
  ) {
    lines = geometry.coordinates.filter(line => Array.isArray(line) && line.length);
  }

  if (!lines.length) return "—";

  const line = endpoint === "end" ? lines[lines.length - 1] : lines[0];
  const coordinate = endpoint === "end" ? line[line.length - 1] : line[0];
  if (!Array.isArray(coordinate) || coordinate.length < 2) return "—";
  return formatLatLon(coordinate[1], coordinate[0]);
}

function crossingLatLon(row) {
  return formatLatLon(row.crossing_lat, row.crossing_lon);
}

function durationMinutes(start, end) {
  const startNumber = Number(start);
  const endNumber = Number(end);

  if (!Number.isFinite(startNumber) || !Number.isFinite(endNumber) || endNumber <= startNumber) {
    return "";
  }

  const startMs = startNumber > 10_000_000_000 ? startNumber : startNumber * 1000;
  const endMs = endNumber > 10_000_000_000 ? endNumber : endNumber * 1000;
  return ((endMs - startMs) / 60000).toFixed(2);
}

function avgSpeed(length, duration) {
  const lengthNumber = Number(length);
  const durationNumber = Number(duration);
  if (!Number.isFinite(lengthNumber) || !Number.isFinite(durationNumber) || durationNumber <= 0) {
    return "";
  }
  return (lengthNumber / (durationNumber / 60)).toFixed(1);
}

function detailRow(key, value, strong = false) {
  return `<div class="detail-key">${key}</div>` +
    `<div class="detail-val${strong ? " strong" : ""}">${clean(value)}</div>`;
}

function crossingRows(row, includeDistance = false) {
  let html = '<div class="detail-grid">';
  html += detailRow("Crossing Lat/Lon:", crossingLatLon(row), true);
  html += detailRow("Crossing date:", formatDateTime(row.crossing_time), true);
  html += detailRow("From:", row.boundary_from, true);
  html += detailRow("To:", row.boundary_to, true);

  if (includeDistance) {
    html += detailRow("Distance into track:", formatWithUnit(row.crossing_distance_miles, "mi"));
  }

  html += "</div>";
  return html;
}

function buildTrackPopup(feature) {
  const properties = feature.properties || {};
  const id = featureEventId(feature) || "UNKNOWN";
  const rows = crossingsByEvent.get(id) || [];
  const first = rows[0] || {};

  const duration = firstNonBlank(
    first.duration_minutes,
    durationMinutes(properties.starttime, properties.endtime)
  );

  const miles = firstNonBlank(first.measured_track_miles, properties.length);
  const speed = firstNonBlank(first.avg_speed_mph, avgSpeed(miles, duration));

  const peakWind = firstNonBlank(
    first.maxwind,
    first.max_wind,
    first.peak_wind_mph,
    first.peak_wind,
    first.mag,
    first.magnitude,
    properties.maxwind,
    properties.max_wind,
    properties.peak_wind_mph,
    properties.peak_wind,
    properties.mag,
    properties.magnitude
  );

  const maxWidth = firstNonBlank(
    first.max_width_yards,
    first.max_width,
    first.width_yards,
    first.width,
    properties.max_width_yards,
    properties.max_width,
    properties.width_yards,
    properties.width
  );

  let html = `<div class="popup-title">${id}</div><div class="detail-grid">`;
  html += detailRow("EF scale:", firstNonBlank(first.efscale, properties.efscale));
  html += detailRow("Peak wind speed:", formatWithUnit(peakWind, "mph"));
  html += detailRow("Max width:", formatWithUnit(maxWidth, "yd"));
  html += detailRow("Start time:", formatDateTime(firstNonBlank(first.start_time, properties.starttime)));
  html += detailRow("Start Lat/Lon:", trackEndpointLatLon(feature, "start"));
  html += detailRow("End time:", formatDateTime(firstNonBlank(first.end_time, properties.endtime)));
  html += detailRow("End Lat/Lon:", trackEndpointLatLon(feature, "end"));
  html += detailRow("Duration:", formatWithUnit(duration, "min"));
  html += detailRow("Track length:", formatWithUnit(miles, "mi"));
  html += detailRow("Avg speed:", formatWithUnit(speed, "mph"));
  html += "</div>";

  if (!rows.length) {
    return html + '<div class="empty-note">No parish/county crossings were found for this tornado path.</div>';
  }

  rows.forEach((row, index) => {
    html += `<div class="crossing-block">` +
      `<div class="crossing-title">Crossing ${index + 1}</div>` +
      `${crossingRows(row, true)}</div>`;
  });

  return html;
}

function addCrossingMarkers(rows) {
  crossingsLayer.clearLayers();

  rows.forEach(row => {
    const lat = parseFloat(row.crossing_lat);
    const lon = parseFloat(row.crossing_lon);
    if (!Number.isFinite(lat) || !Number.isFinite(lon)) return;

    crossingsLayer.addLayer(
      L.marker([lat, lon], { icon: crossingIcon }).bindPopup(
        `<div class="popup-title">Boundary Crossing</div>` +
        `<div class="crossing-block">${crossingRows(row, false)}</div>`,
        { maxWidth: 540 }
      )
    );
  });
}

function addLegend() {
  const legend = L.control({ position: "bottomright" });

  legend.onAdd = () => {
    const container = L.DomUtil.create("div", "legend");
    const labels = ["EF0", "EF1", "EF2", "EF3", "EF4", "EF5", "Unknown"];

    container.innerHTML =
      '<div class="legend-title">Path color</div>' +
      labels.map(label =>
        `<div class="legend-row">` +
        `<span class="swatch" style="background:${label === "Unknown" ? efColor("") : efColor(label)}"></span>` +
        `${label}</div>`
      ).join("") +
      '<div class="legend-row">' +
      '<span class="crossing-marker" style="display:inline-block"></span> Crossing' +
      "</div>";

    return container;
  };

  legend.addTo(map);
}

function loadSavedFilter() {
  try {
    return JSON.parse(localStorage.getItem(FILTER_STORAGE_KEY) || "null") || {};
  } catch (error) {
    console.warn("Could not load saved date filter", error);
    return {};
  }
}

function saveFilter(startDate, endDate) {
  try {
    localStorage.setItem(FILTER_STORAGE_KEY, JSON.stringify({ startDate, endDate }));
  } catch (error) {
    console.warn("Could not save date filter", error);
  }
}

function setFilterPanelCollapsed(collapsed) {
  const panel = document.getElementById("filterPanel");
  const toggle = document.getElementById("filterPanelToggle");

  panel.classList.toggle("collapsed", collapsed);
  toggle.textContent = collapsed ? "Expand" : "Collapse";
  toggle.setAttribute("aria-expanded", String(!collapsed));

  try {
    localStorage.setItem(FILTER_PANEL_COLLAPSED_STORAGE_KEY, collapsed ? "1" : "0");
  } catch (error) {
    console.warn("Could not save filter panel state", error);
  }

  window.setTimeout(() => map.invalidateSize(true), 0);
}

function initFilterPanel() {
  let collapsed = false;

  try {
    collapsed = localStorage.getItem(FILTER_PANEL_COLLAPSED_STORAGE_KEY) === "1";
  } catch (error) {
    console.warn("Could not load filter panel state", error);
  }

  setFilterPanelCollapsed(collapsed);

  document.getElementById("filterPanelToggle").addEventListener("click", () => {
    const panel = document.getElementById("filterPanel");
    setFilterPanelCollapsed(!panel.classList.contains("collapsed"));
  });
}

function setDefaultFilterDates() {
  const saved = loadSavedFilter();
  const startInput = document.getElementById("startDate");
  const endInput = document.getElementById("endDate");

  startInput.min = ARCHIVE_START;
  endInput.min = ARCHIVE_START;
  startInput.max = archiveEnd;
  endInput.max = archiveEnd;

  const currentYearStart = `${archiveEnd.slice(0, 4)}-01-01`;
  const startDate = saved.startDate && saved.startDate >= ARCHIVE_START && saved.startDate <= archiveEnd
    ? saved.startDate
    : currentYearStart;
  const endDate = saved.endDate && saved.endDate >= ARCHIVE_START && saved.endDate <= archiveEnd
    ? saved.endDate
    : archiveEnd;

  startInput.value = startDate;
  endInput.value = endDate;
}

function applyDateFilter(fitMap = true) {
  const status = document.getElementById("filterStatus");
  const startDate = document.getElementById("startDate").value;
  const endDate = document.getElementById("endDate").value;

  if (!startDate || !endDate) {
    status.style.color = "#991b1b";
    status.textContent = "Choose a start and end date.";
    return;
  }

  if (startDate < ARCHIVE_START) {
    status.style.color = "#991b1b";
    status.textContent = `Archive begins ${ARCHIVE_START}.`;
    return;
  }

  if (endDate < startDate) {
    status.style.color = "#991b1b";
    status.textContent = "End date must be on or after start date.";
    return;
  }

  const features = allTracks.features.filter(feature =>
    featureOverlapsRange(feature, startDate, endDate)
  );

  const eventIds = new Set(features.map(featureEventId).filter(Boolean));
  const crossings = allCrossings.filter(row => eventIds.has(row._resolved_event_id));

  pathLayer.clearLayers();
  pathLayer.addData({ type: "FeatureCollection", features });
  addCrossingMarkers(crossings);

  saveFilter(startDate, endDate);

  status.style.color = "#334155";
  status.textContent = `${features.length} path(s), ${crossings.length} crossing(s) shown.`;

  document.getElementById("summary").textContent =
    `${features.length} of ${allTracks.features.length} tornado path(s), ` +
    `${crossings.length} parish/county crossing record(s) shown`;

  if (fitMap) {
    const bounds = pathLayer.getBounds();
    if (bounds.isValid()) {
      map.fitBounds(bounds.pad(.18));
    }
  }
}

function showAllArchive() {
  document.getElementById("startDate").value = ARCHIVE_START;
  document.getElementById("endDate").value = archiveEnd;
  applyDateFilter(true);
}

function showError(message) {
  const box = document.createElement("div");
  box.className = "error-box";
  box.textContent = message;
  document.body.appendChild(box);
  document.getElementById("summary").textContent = "Map failed to load.";
}

async function init() {
  try {
    initFilterPanel();

    map.invalidateSize(true);
    window.setTimeout(() => map.invalidateSize(true), 200);

    const [tracksResponse, crossingsResponse] = await Promise.all([
      fetch(TRACKS_URL, { cache: "no-store" }),
      fetch(CROSSINGS_URL, { cache: "no-store" })
    ]);

    if (!tracksResponse.ok) throw new Error(`Could not load ${TRACKS_URL}`);
    if (!crossingsResponse.ok) throw new Error(`Could not load ${CROSSINGS_URL}`);

    allTracks = await tracksResponse.json();
    const csv = await crossingsResponse.text();
    allCrossings = parseCsv(csv);
    crossingsByEvent = groupCrossings(allCrossings, allTracks);

    archiveEnd = todayDateKey();

    setDefaultFilterDates();
    addLegend();

    document.getElementById("filterBtn").addEventListener("click", () => applyDateFilter(true));
    document.getElementById("allBtn").addEventListener("click", showAllArchive);
    document.getElementById("startDate").addEventListener("change", () => applyDateFilter(true));
    document.getElementById("endDate").addEventListener("change", () => applyDateFilter(true));

    applyDateFilter(true);
    window.setTimeout(() => map.invalidateSize(true), 100);
  } catch (error) {
    console.error(error);
    showError(error.message || String(error));
  }
}

window.addEventListener("resize", () => map.invalidateSize(true));
init();
</script>
</body>
</html>
